name: public-health
on:
  workflow_dispatch:
  schedule:
    - cron: '40 22 * * *'
permissions:
  contents: read
jobs:
  monitor:
    if: vars.PUBLIC_LAUNCH_CONFIRMED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run monitor
